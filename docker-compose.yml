services:
  # =========================================================================
  # NGINX + Certbot (TLS-терминация, Let's Encrypt)
  # =========================================================================
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/api.conf.template:/etc/nginx/conf.d/api.conf.template:ro
      - certbot_data:/var/www/certbot
      - certbot_certs:/etc/letsencrypt:ro
    command: |
      /bin/sh -c "envsubst '$$DOMAIN_NAME' < /etc/nginx/conf.d/api.conf.template > /etc/nginx/conf.d/api.conf && nginx -g 'daemon off;'"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - certbot_data:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: |
      /bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --quiet; done'
    restart: unless-stopped

  # =========================================================================
  # BACKEND
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:15-alpine
    container_name: database
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.8.4
    container_name: livekit
    ports:
      - "7880:7880" # WebRTC / WebSocket
      - "7881:7881" # HTTP API
      - "50000-50100:50000-50100" # RTC media
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_PORT: "7880"
      LIVEKIT_RTC_PORT_RANGE_START: "50000"
      LIVEKIT_RTC_PORT_RANGE_END: "50100"
      LIVEKIT_RTC_STUN_SERVERS: "stun:stun.l.google.com:19302"
      LIVEKIT_REDIS_ADDRESS: "redis:6379"
      LIVEKIT_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      LIVEKIT_CONFIG: |
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://backend:8000/livekit/webhook
    volumes:
      - ./data/livekit:/data
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  # LiveKit Egress — запись занятий
  livekit-egress:
    image: livekit/egress:v1.8.4
    container_name: livekit-egress
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit-egress.yaml:/etc/egress.yaml:ro
    depends_on:
      livekit:
        condition: service_healthy
    restart: unless-stopped

volumes:
  certbot_data:
  certbot_certs:
