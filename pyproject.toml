[project]
name = "platform-for-online-lesson"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.136",
    "jinja2>=3.1.6",
    "livekit>=1.1.13",
    "livekit-api>=1.1.1",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "python-dotenv>=1.2",
    "python-jose>=3.5.0",
    "python-slugify>=8",
    "redis>=7.4.0",
    "sqlalchemy>=2.0.50",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.48.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21.0",
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "pytest-cov>=6.0.0",
]

[tool.mypy]
strict = true
plugins = "sqlalchemy.ext.mypy.plugin"

[[tool.mypy.overrides]]
module = [
    "livekit",
    "livekit.*",
    "livekit_api",
    "livekit_api.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "backend.models.*",
    "backend.api.*",
]
disable_error_code = ["arg-type", "attr-defined"]

[tool.pyright]
typeCheckingMode = "standard"
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false
reportArgumentType = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
